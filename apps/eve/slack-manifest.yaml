# Slack app manifest for Eve. Create the app at https://api.slack.com/apps
# → "Create New App" → "From a manifest" → paste this. Then replace
# YOUR-EVE-DEPLOYMENT with your Vercel deployment domain.
display_information:
  name: Eve
  description: Website agent — builds, edits, and deploys sites from Slack
  background_color: "#123f36"
features:
  bot_user:
    display_name: eve
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - reactions:write
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    request_url: https://YOUR-EVE-DEPLOYMENT.vercel.app/api/slack/events
    bot_events:
      - app_mention
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
