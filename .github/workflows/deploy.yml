# Continuous deploy: test the whole workspace, then redeploy to Vercel.
#
# `deploy-wb-api` ships the REST API **and the drag-and-drop visual editor**
# (bundled into apps/wb-api and served at /editor/). It runs on every push to
# main and is smoke-tested afterwards.
#
# `deploy-eve` (the optional Slack agent) stays OFF until you opt in, because it
# needs extra Slack/Vercel-Connect setup — so a not-yet-configured Eve can never
# turn the editor's deploy red.
#
# One-time setup (after scripts/setup-cloud.sh has created the Vercel projects):
#   GitHub repo → Settings → Secrets and variables → Actions
#   Secrets:
#     VERCEL_TOKEN              a Vercel API token
#     VERCEL_ORG_ID             from apps/wb-api/.vercel/project.json after `vercel link`
#     VERCEL_WB_API_PROJECT_ID  "projectId" from apps/wb-api/.vercel/project.json
#     VERCEL_EVE_PROJECT_ID     "projectId" from apps/eve/.vercel/project.json (only if deploying Eve)
#   Variables (optional):
#     DEPLOY_EVE=true           enable the Eve deploy job (defaults to off)
#   (Runtime env vars — WB_DB_URL, WB_S3_*, WB_API_TOKEN, … — live in the Vercel projects, not here.)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  # REST API + the visual editor (served at /editor/).
  deploy-wb-api:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WB_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm i -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/wb-api
      - name: Deploy wb-api (API + editor) to production
        id: deploy
        working-directory: apps/wb-api
        run: |
          url="$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
      - name: Smoke-test the editor
        run: |
          curl -sSf "${{ steps.deploy.outputs.url }}/editor/" -o /dev/null
          echo "✅ Editor is live at ${{ steps.deploy.outputs.url }}/editor/"

  # Optional Slack agent. Set repo variable DEPLOY_EVE=true to turn this on.
  deploy-eve:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_EVE == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_EVE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm i -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/eve
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/eve
        env:
          VERCEL_USE_EXPERIMENTAL_FRAMEWORKS: '1'
